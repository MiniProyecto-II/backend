# Levanta el backend-api con: docker compose up --build
services:
  backend-api:
    build: .
    container_name: backend-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
