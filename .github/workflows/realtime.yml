name: Realtime
on:
  pull_request:
  push:
    branches: [feature/TS-02-modelo-salas]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build --workspace backend-realtime
      - run: npm test --workspace backend-realtime
